# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate && open CornholeVision.xcodeproj
name: CornholeVision
options:
  bundleIdPrefix: com.jarredsmith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SVYYTM3LTN
    PRODUCT_BUNDLE_IDENTIFIER: com.jarredsmith.cornholevision
targets:
  CornholeVision:
    type: application
    platform: iOS
    sources:
      - path: CornholeVision
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "Models/**"
      - path: CornholeVision/Models/BagDetector.mlpackage
        type: file
        buildPhase: sources
    info:
      path: CornholeVision/Info.plist
      properties:
        CFBundleDisplayName: Cornhole Vision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Cornhole Vision watches the board to score the game automatically.
        NSMotionUsageDescription: Used to notice when the phone is picked up and moved to the other board.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarHidden: true
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: minimal
