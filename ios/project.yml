# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate && open CornholeVision.xcodeproj
name: CornholeVision
options:
  bundleIdPrefix: com.jarredsmith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here or in Xcode > Signing & Capabilities
    # DEVELOPMENT_TEAM: ABCDE12345
targets:
  CornholeVision:
    type: application
    platform: iOS
    sources:
      - path: CornholeVision
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    info:
      path: CornholeVision/Info.plist
      properties:
        CFBundleDisplayName: Cornhole Vision
        NSCameraUsageDescription: Cornhole Vision watches the board to score the game automatically.
        NSMotionUsageDescription: Used to notice when the phone is picked up and moved to the other board.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarHidden: true
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: minimal
